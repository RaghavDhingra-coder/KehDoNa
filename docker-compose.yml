# Local PostgreSQL for KehDoNa development.
# Usage: docker compose up -d   (stop with: docker compose down)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kehdona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kehdona}
      POSTGRES_DB: ${POSTGRES_DB:-kehdona}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - kehdona-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kehdona} -d ${POSTGRES_DB:-kehdona}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kehdona-db:
